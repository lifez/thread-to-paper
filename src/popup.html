<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thread to Paper</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
    }
    button:hover {
      background: #f5f5f5;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      min-height: 1.2em;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .row input {
      width: 52px;
      padding: 4px 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .row .hint {
      color: #999;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>Thread to Paper</h1>
  <div class="row">
    <label for="maxScrolls">Max scrolls:</label>
    <input type="number" id="maxScrolls" value="3" min="1" max="999" />
    <span class="hint">(higher for long threads)</span>
  </div>
  <button id="extractBtn">Create PDF View</button>
  <div id="status"></div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
